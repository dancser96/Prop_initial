# Credit Cards — second example. Copy this shape per product; ONE schema.
product: credit_cards
table: "hdfs:///retail/snapshots/credit_cards"
id_col: cif
month_col: snapshot_month

obs_date:   2026-03-01
oot_date:   2026-06-01
infer_date: 2026-08-01

features_include:
  - age
  - tenure_months
  - salary_band
  - avg_balance_3m
  - txn_count_3m
  # ... the rest of the curated list

features_exclude: []       # decide in the Feature Checks notebook

eligibility_expr: "eligible_segment = 1 AND is_cardholder = 0"

target_col: card_activation_target
window_months: 3

model:
  time_budget: 300
  estimator_list: [lgbm, xgboost, rf, extra_tree]
  n_splits: 5
  seed: 42

metric: roc_auc
baseline: population_base_rate
min_base_rate: 0.001
max_base_rate: 0.60
