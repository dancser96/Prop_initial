# Credit Cards — second example: imbalanced target -> downsample + auto-calibration.
product: credit_cards
table: "hdfs:///retail/snapshots/modelling_panel"
id_col: cif
month_col: snapshot_month

obs_date:   2026-03-01
oot_date:   2026-06-01
infer_date: 2026-08-01

features_include:
  - age
  - tenure_months
  - salary_band
  - avg_balance_3m
  - txn_count_3m
  # ... rest of the curated list

features_exclude: []         # decide in Feature Checks

eligibility_expr: "eligible_segment = 1 AND is_cardholder = 0"

target_col: card_activation_target
window_months: 3

model:
  time_budget: 300
  estimator_list: [lgbm, xgboost, rf, extra_tree]
  eval_method: cv
  n_splits: 5
  ensemble: false
  seed: 42

downsample:                  # low base rate -> all positives + 15 negatives each
  neg_per_pos: 15
calibration: prior_shift     # applied automatically because downsample is set

metric: roc_auc            # roc_auc | ap | log_loss | f1 | macro_f1 | micro_f1 | accuracy (see _TEMPLATE)
baseline: population_base_rate
min_base_rate: 0.001
max_base_rate: 0.60
